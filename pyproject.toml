[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-fund-lab"
version = "0.7.0"
description = "Local quantitative research, backtesting, paper-trading and visualization platform."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "pyarrow>=15,<22",
  "scipy>=1.10,<2",
  "exchange-calendars>=4.5,<5",
  "yfinance>=0.2.40,<1",
  "streamlit>=1.35,<2",
  "plotly>=5.20,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"
